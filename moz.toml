# moz.toml — example configuration
# Full key reference: docs/spec-config.md

[log]
level = "debug"

[[device]]
name = "plc-a"
holding = 1000
coils = 1000

[[device]]
name = "plc-mirror"
holding = 1000

# Struct (phase 8): fields laid out sequentially; expands to the leaf
# variables motor.speed / motor.on / motor.label (scripts, logs, OPC UA
# all see the leaves; OPC UA shows them under a "motor" folder).
[[struct]]
name = "Motor"

[[struct.field]]
name = "speed"
type = "int"

[[struct.field]]
name = "on"
type = "bool"

[[struct.field]]
name = "label"
type = "string"
length = 8

[[variable]]
name = "temperature"
device = "plc-a"
kind = "holding"
offset = 0
type = "real"

[[variable]]
name = "temperature-mirror"
device = "plc-mirror"
kind = "holding"
offset = 0
type = "real"

[[variable]]
name = "pump"
device = "plc-a"
kind = "coil"
offset = 0
type = "bool"

[[variable]]
name = "motor"
device = "plc-a"
kind = "holding"
offset = 100
type = "Motor"

[[variable]]
name = "updated"
device = "plc-a"
kind = "holding"
offset = 110
type = "dt"

[[script]]
name = "demo-counter"
device = "plc-a"
path = "scripts/counter.js"
interval_ms = 500

[[client]]
name = "self-poll"
device = "plc-mirror"
remote_addr = "127.0.0.1:50200"
remote_unit = 1
interval_ms = 500

[[client.poll]]
fc = 3
remote_offset = 0
count = 2
local_offset = 0

[[server]]
name = "sim-a"
protocol = "modbus-tcp"
device = "plc-a"
bind = "127.0.0.1"
port = 50200
unit_ids = [1]

[[server]]
name = "sim-b"
protocol = "modbus-tcp"
device = "plc-a"
bind = "127.0.0.1"
port = 50201

# OPC UA example (phase 7): publish the plc-a variables as nodes.
# Nodes live under Objects/plc-ua (ns=urn:moz:ua:ns).
[[server]]
name = "ua-a"
protocol = "opcua"
device = "plc-a"
endpoint = "opc.tcp://127.0.0.1:48400"
