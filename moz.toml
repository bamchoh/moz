# moz.toml — example configuration
# Full key reference: docs/spec-config.md

[log]
level = "debug"

[[device]]
name = "plc-a"
words = 1000
bits = 1000

[[device]]
name = "plc-mirror"
words = 1000

# Struct (phase 8): fields laid out sequentially; expands to the leaf
# variables motor.speed / motor.on / motor.label (scripts, logs, OPC UA
# all see the leaves; OPC UA shows them under a "motor" folder).
[[struct]]
name = "Motor"

[[struct.field]]
name = "speed"
type = "int"

[[struct.field]]
name = "on"
type = "bool"

[[struct.field]]
name = "label"
type = "string"
length = 8

[[variable]]
name = "temperature"
device = "plc-a"
kind = "words"
offset = 0
type = "real"
value = 20.0            # initial value, seeded before anything runs

[[variable]]
name = "temperature-mirror"
device = "plc-mirror"
kind = "words"
offset = 0
type = "real"

# written by scripts/setpoint.js on plc-mirror and pushed to plc-a (see [[client.push]])
[[variable]]
name = "setpoint"
device = "plc-mirror"
kind = "words"
offset = 20
type = "int"

# filled by the OPC UA client "ua-self-poll" below (plc-a temperature via ua-a)
[[variable]]
name = "ua-temperature"
device = "plc-mirror"
kind = "words"
offset = 70
type = "real"

# where the pushed value lands on plc-a
[[variable]]
name = "setpoint-received"
device = "plc-a"
kind = "words"
offset = 20
type = "int"

[[variable]]
name = "pump"
device = "plc-a"
kind = "bits"
offset = 0
type = "bool"

[[variable]]
name = "motor"
device = "plc-a"
kind = "words"
offset = 100
type = "Motor"
value = { speed = 100, on = false, label = "idle" }   # struct initial value (fields left out stay 0)

[[variable]]
name = "updated"
device = "plc-a"
kind = "words"
offset = 110
type = "dt"

[[script]]
name = "demo-counter"
device = "plc-a"
path = "scripts/counter.js"
interval_ms = 500

[[script]]
name = "demo-setpoint"
device = "plc-mirror"
path = "scripts/setpoint.js"
interval_ms = 2000

[[client]]
name = "self-poll"
device = "plc-mirror"
remote_addr = "127.0.0.1:50200"
remote_unit = 1
interval_ms = 500

[[client.poll]]
fc = 3
remote_offset = 0
count = 2
local_offset = 0

# push (phase 9): every change of plc-mirror words 20..21 (the "setpoint"
# variable) is written to plc-a words 20..21; nothing is read back here
[[client.push]]
fc = 16
local_offset = 20
count = 2
remote_offset = 20

# MC protocol master (phase 12): same poll/push loop, MELSEC device notation.
# Polls D0..D1 (the "temperature" real of plc-a) through the mc-3e server
# "mc-a" below into plc-mirror words 50..51.
[[client]]
name = "mc-self-poll"
protocol = "mc-3e"
device = "plc-mirror"
remote_addr = "127.0.0.1:5010"
interval_ms = 1000

[[client.poll]]
remote = "D0"
count = 2
local_offset = 50

# OPC UA client (phase 14): node <-> typed local variable. Polls plc-a's
# "temperature" node from the ua-a server below into plc-mirror.
[[client]]
name = "ua-self-poll"
protocol = "opcua"
device = "plc-mirror"
endpoint = "opc.tcp://127.0.0.1:48400"
interval_ms = 1000

[[client.poll]]
node = "nsu=urn:moz:ua:ns;s=temperature"
variable = "ua-temperature"

# RTU master (phase 11): same poll/push keys, serial keys as on an RTU server.
# Commented out because it needs a real serial port to open.
# [[client]]
# name = "rtu-master"
# protocol = "modbus-rtu"
# device = "plc-mirror"
# serial_port = "COM11"
# baud = 9600
# remote_unit = 1
# interval_ms = 1000
# timeout_ms = 1000
#
# [[client.poll]]
# fc = 3
# remote_offset = 0
# count = 2
# local_offset = 40

[[server]]
name = "sim-a"
protocol = "modbus-tcp"
device = "plc-a"
bind = "127.0.0.1"
port = 50200
unit_ids = [1]

[[server]]
name = "sim-b"
protocol = "modbus-tcp"
device = "plc-a"
bind = "127.0.0.1"
port = 50201

# MC protocol server (phase 13): plc-a as a MELSEC CPU. Default map:
# D -> words, M -> bits, X -> read_only_bits (all from 0); add [[server.map]]
# for other devices, e.g. W -> words 500.
[[server]]
name = "mc-a"
protocol = "mc-3e"
device = "plc-a"
bind = "127.0.0.1"
port = 5010

[[server.map]]
device = "W"
kind = "words"
offset = 500

# FINS server (phase 19): plc-a as an Omron CPU unit. Default map: DM -> words
# (from 0); every other area needs a [[server.map]] (word tables only, bit
# access addresses bits inside the words). FINS/TCP with node 10; add a
# second [[server]] with protocol = "fins-udp" for UDP clients.
[[server]]
name = "fins-a"
protocol = "fins-tcp"
device = "plc-a"
bind = "127.0.0.1"
port = 9600
node = 10

[[server.map]]
device = "CIO"
kind = "words"
offset = 600
count = 100

# Keyence KV host link server (phase 21): plc-a as a KV CPU unit, ASCII lines
# on 8501 ("RD DM100", "WRS DM0 2 1 2", "ST R100"). Default map: DM -> words,
# R -> bits; MR below goes to the read-only bit table.
[[server]]
name = "kv-a"
protocol = "kv-hostlink"
device = "plc-a"
bind = "127.0.0.1"
port = 8501

[[server.map]]
device = "MR"
kind = "read_only_bits"
offset = 0

# Siemens S7 server (phase 22): plc-a as a CPU 315-2 PN/DP on port 102
# (S7comm over ISO-on-TCP; any rack/slot). Default map: DB1 -> words; M below
# maps flags onto words 800.. (MW0 = words[800], MB1 = its low byte).
[[server]]
name = "s7-a"
protocol = "s7"
device = "plc-a"
bind = "127.0.0.1"
port = 102

[[server.map]]
device = "M"
kind = "words"
offset = 800
count = 100

# EtherNet/IP tag server (phase 23): the plc-a variables (temperature, ...)
# as Logix-style tags on 44818. pycomm3: LogixDriver("127.0.0.1").read("temperature").
[[server]]
name = "enip-a"
protocol = "enip"
device = "plc-a"
bind = "127.0.0.1"
port = 44818

# OPC UA example (phase 7): publish the plc-a variables as nodes.
# Nodes live under Objects/plc-ua (ns=urn:moz:ua:ns).
[[server]]
name = "ua-a"
protocol = "opcua"
device = "plc-a"
endpoint = "opc.tcp://127.0.0.1:48400"
anonymous = "read"      # phase 15: anonymous sessions (e.g. ua-self-poll) may only read
security = ["none", "sign-encrypt", "aes256-sha256-rsapss:sign-encrypt", "rsa-dh-aesgcm:sign-encrypt"]   # phase 16-18: plain for ua-self-poll; Basic256Sha256, Aes256 and the 1.05 RSA_DH_AesGcm for secure clients

[[server.user]]         # writes need this user (UAExpert: user name token)
name = "operator"
password = "op-pass"
access = "write"
