# moz.toml — example configuration
# Full key reference: docs/spec-config.md

[log]
level = "debug"

[[device]]
name = "plc-a"
holding = 1000
coils = 1000

[[device]]
name = "plc-mirror"
holding = 1000

# Struct (phase 8): fields laid out sequentially; expands to the leaf
# variables motor.speed / motor.on / motor.label (scripts, logs, OPC UA
# all see the leaves; OPC UA shows them under a "motor" folder).
[[struct]]
name = "Motor"

[[struct.field]]
name = "speed"
type = "int"

[[struct.field]]
name = "on"
type = "bool"

[[struct.field]]
name = "label"
type = "string"
length = 8

[[variable]]
name = "temperature"
device = "plc-a"
kind = "holding"
offset = 0
type = "real"
value = 20.0            # initial value, seeded before anything runs

[[variable]]
name = "temperature-mirror"
device = "plc-mirror"
kind = "holding"
offset = 0
type = "real"

# written by scripts/setpoint.js on plc-mirror and pushed to plc-a (see [[client.push]])
[[variable]]
name = "setpoint"
device = "plc-mirror"
kind = "holding"
offset = 20
type = "int"

# filled by the OPC UA client "ua-self-poll" below (plc-a temperature via ua-a)
[[variable]]
name = "ua-temperature"
device = "plc-mirror"
kind = "holding"
offset = 70
type = "real"

# where the pushed value lands on plc-a
[[variable]]
name = "setpoint-received"
device = "plc-a"
kind = "holding"
offset = 20
type = "int"

[[variable]]
name = "pump"
device = "plc-a"
kind = "coil"
offset = 0
type = "bool"

[[variable]]
name = "motor"
device = "plc-a"
kind = "holding"
offset = 100
type = "Motor"
value = { speed = 100, on = false, label = "idle" }   # struct initial value (fields left out stay 0)

[[variable]]
name = "updated"
device = "plc-a"
kind = "holding"
offset = 110
type = "dt"

[[script]]
name = "demo-counter"
device = "plc-a"
path = "scripts/counter.js"
interval_ms = 500

[[script]]
name = "demo-setpoint"
device = "plc-mirror"
path = "scripts/setpoint.js"
interval_ms = 2000

[[client]]
name = "self-poll"
device = "plc-mirror"
remote_addr = "127.0.0.1:50200"
remote_unit = 1
interval_ms = 500

[[client.poll]]
fc = 3
remote_offset = 0
count = 2
local_offset = 0

# push (phase 9): every change of plc-mirror holding 20..21 (the "setpoint"
# variable) is written to plc-a holding 20..21; nothing is read back here
[[client.push]]
fc = 16
local_offset = 20
count = 2
remote_offset = 20

# MC protocol master (phase 12): same poll/push loop, MELSEC device notation.
# Polls D0..D1 (the "temperature" real of plc-a) through the mc-3e server
# "mc-a" below into plc-mirror holding 50..51.
[[client]]
name = "mc-self-poll"
protocol = "mc-3e"
device = "plc-mirror"
remote_addr = "127.0.0.1:5010"
interval_ms = 1000

[[client.poll]]
remote = "D0"
count = 2
local_offset = 50

# OPC UA client (phase 14): node <-> typed local variable. Polls plc-a's
# "temperature" node from the ua-a server below into plc-mirror.
[[client]]
name = "ua-self-poll"
protocol = "opcua"
device = "plc-mirror"
endpoint = "opc.tcp://127.0.0.1:48400"
interval_ms = 1000

[[client.poll]]
node = "nsu=urn:moz:ua:ns;s=temperature"
variable = "ua-temperature"

# RTU master (phase 11): same poll/push keys, serial keys as on an RTU server.
# Commented out because it needs a real serial port to open.
# [[client]]
# name = "rtu-master"
# protocol = "modbus-rtu"
# device = "plc-mirror"
# serial_port = "COM11"
# baud = 9600
# remote_unit = 1
# interval_ms = 1000
# timeout_ms = 1000
#
# [[client.poll]]
# fc = 3
# remote_offset = 0
# count = 2
# local_offset = 40

[[server]]
name = "sim-a"
protocol = "modbus-tcp"
device = "plc-a"
bind = "127.0.0.1"
port = 50200
unit_ids = [1]

[[server]]
name = "sim-b"
protocol = "modbus-tcp"
device = "plc-a"
bind = "127.0.0.1"
port = 50201

# MC protocol server (phase 13): plc-a as a MELSEC CPU. Default map:
# D -> holding, M -> coil, X -> discrete (all from 0); add [[server.map]]
# for other devices, e.g. W -> holding 500.
[[server]]
name = "mc-a"
protocol = "mc-3e"
device = "plc-a"
bind = "127.0.0.1"
port = 5010

[[server.map]]
device = "W"
kind = "holding"
offset = 500

# OPC UA example (phase 7): publish the plc-a variables as nodes.
# Nodes live under Objects/plc-ua (ns=urn:moz:ua:ns).
[[server]]
name = "ua-a"
protocol = "opcua"
device = "plc-a"
endpoint = "opc.tcp://127.0.0.1:48400"
